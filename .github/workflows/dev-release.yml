name: dev-release

# Dev-stage release: on every push to main, build a single embedded-PCK
# godot binary and publish it as an asset on a rolling `dev-latest`
# release plus a snapshot `dev-<sha>` tag. No stable / signed / notarized
# release cadence here; that's a separate workflow when the game is
# actually shippable.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out starforged project
        uses: actions/checkout@v4
        with:
          path: starforged

      - name: Check out entities-godot (engine tree)
        uses: actions/checkout@v4
        with:
          repository: v-sekai-fabric/entities-godot
          ref: feat/vsk-sandbox-4.7
          path: entities-godot
          submodules: false

      - name: Check out godot-sandbox module
        uses: actions/checkout@v4
        with:
          repository: v-sekai-fabric/godot-sandbox
          path: entities-godot/modules/sandbox

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libglu-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm llvm

      - name: scons build (GDScript disabled, sandbox+game only)
        working-directory: entities-godot
        run: |
          scons -j$(nproc) \
            platform=linuxbsd \
            target=template_release \
            module_gdscript_enabled=no \
            tools=no \
            optimize=size

      - name: Export project as embedded-PCK single binary
        run: |
          BIN=entities-godot/bin/godot.linuxbsd.template_release.x86_64
          chmod +x "$BIN"
          "$BIN" --headless --path starforged \
            --export-pack "Dev Linux" \
            --embed-pck build/starforged-dev-linux.bin
          ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starforged-dev-linux
          path: build/starforged-dev-linux.bin
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: starforged-dev-linux
          path: build

      - name: Publish rolling dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the previous dev-latest so the asset name doesn't
          # collide; keep the tag pointed at the newest commit.
          gh release delete dev-latest --repo ${{ github.repository }} \
            --yes --cleanup-tag || true
          gh release create dev-latest \
            --repo ${{ github.repository }} \
            --title "Dev — latest (${{ github.sha }})" \
            --notes "Dev-stage build from ${{ github.sha }}. Single embedded-PCK binary. Not signed, not notarized." \
            --prerelease \
            build/starforged-dev-linux.bin

      - name: Publish snapshot dev-<sha> release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          gh release create "dev-${SHA_SHORT}" \
            --repo ${{ github.repository }} \
            --title "Dev — ${SHA_SHORT}" \
            --notes "Snapshot dev build from ${{ github.sha }}. Single embedded-PCK binary. Immutable pin for reproducing this state." \
            --prerelease \
            build/starforged-dev-linux.bin
